[build]
  command = "node -e \"if(process.env.FIREBASE_SERVICE_ACCOUNT){require('fs').writeFileSync('.firebase-sa.json',Buffer.from(process.env.FIREBASE_SERVICE_ACCOUNT,'base64').toString('utf-8'))}\" && pnpm build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefix=/dev/null"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
