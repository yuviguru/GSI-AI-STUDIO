# Workspace-root netlify.toml.
#
# Each app has its own netlify.toml inside apps/<id>/. Configure the two
# Netlify sites independently in the dashboard:
#
#   kids.gsi.ai    → base = apps/kid    → reads apps/kid/netlify.toml
#   schools.gsi.ai → base = apps/school → reads apps/school/netlify.toml
#
# This root file is a fallback that builds the kid app — useful if a
# Netlify site is misconfigured without a base directory. Kid-context
# scheduled functions live in apps/kid/netlify/functions/; school ones
# live in apps/school/netlify/functions/. The split keeps a school
# function failure from blocking the kid deploy and vice versa.
#
# `base = "apps/kid"` is required so @netlify/plugin-nextjs runs from
# inside the kid app and finds exactly one Next.js project. Without it
# the framework detector inspects the repo root, sees all eight pnpm
# workspaces (@gsi/app-kid, @gsi/app-school, @gsi/ai, @gsi/dpdp,
# @gsi/firebase, @gsi/safety, @gsi/types, @gsi/ui), and fails with
# "Projects detected: …  Configure the project you want to work with".
# `publish` and `functions` are now relative to that base.

[build]
  base = "apps/kid"
  command = "pnpm --filter @gsi/app-kid build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--shamefully-hoist"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
