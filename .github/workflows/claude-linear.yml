name: Claude Code — Linear Issues

on:
  repository_dispatch:
    types: [linear-issue]

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create feature branch
        id: branch
        run: |
          ISSUE_ID="${{ github.event.client_payload.issue_id }}"
          TITLE="${{ github.event.client_payload.title }}"
          # Slugify: lowercase, replace spaces/special chars with hyphens, trim
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-50)
          BRANCH="${ISSUE_ID}-${SLUG}"
          echo "branch_name=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

      - name: Select model
        id: model
        run: |
          LABELS='${{ toJSON(github.event.client_payload.labels) }}'
          # Only "quick-fix" label triggers Sonnet, everything else uses Opus
          if echo "$LABELS" | grep -q '"quick-fix"'; then
            echo "name=claude-sonnet-4-6" >> "$GITHUB_OUTPUT"
            echo "Selected model: claude-sonnet-4-6"
          else
            echo "name=claude-opus-4-6" >> "$GITHUB_OUTPUT"
            echo "Selected model: claude-opus-4-6"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --model ${{ steps.model.outputs.name }}
            --allowedTools "Read,Edit,Write,Bash,Glob,Grep"
          prompt: |
            ## Linear Issue: ${{ github.event.client_payload.issue_id }}
            **Title:** ${{ github.event.client_payload.title }}

            **Description:**
            ${{ github.event.client_payload.description }}

            ## Instructions
            1. Read `.claude/CLAUDE.md` — it contains the MANDATORY development workflow.
               Follow it exactly: load context → check/update docs → implement → verify.
            2. Find the matching story file in `stories/` by issue prefix (e.g., STUDIO-004, UI-001).
               If no story file exists, create one following `.claude/skills/story-creator.md`.
            3. Follow the complete 4-phase workflow in CLAUDE.md. Do NOT skip context loading or doc updates.
               If docs are missing architecture for this feature, design it and update docs BEFORE writing code.
            4. Read the relevant `.claude/skills/*.md` files for the type of work you're doing
               (story-runner for full stories, fn-generator for API routes, code-generator for all code).
            5. Prefix ALL commits with `${{ github.event.client_payload.issue_id }}:`.
            6. After all checks pass (lint, typecheck, test, build), create a PR:
               ```
               gh pr create --title "${{ github.event.client_payload.issue_id }}: ${{ github.event.client_payload.title }}" --body "Resolves ${{ github.event.client_payload.issue_id }}"
               ```
