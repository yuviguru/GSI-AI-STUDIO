name: Claude Code — PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    if: |
      (github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --model claude-opus-4-6
            --allowedTools "Read,Edit,Write,Bash,Glob,Grep"
          prompt: |
            You are working on the GSI AI Studio project — an AI creation + learning platform for Indian kids.
            Read `.claude/CLAUDE.md` for project context and conventions.

            Address the review feedback in the PR comment. Fix the issues, then run ALL checks:
            - `pnpm lint`
            - `pnpm typecheck`
            - `pnpm test -- --run`
            - `pnpm build`

            Fix any failures before pushing. Commit with a clear message describing what you fixed.
