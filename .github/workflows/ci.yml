name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Echo before checkout
        run: echo "Runner is up. Now attempting checkout."
      - uses: actions/checkout@v4
      - name: Echo after checkout
        run: |
          echo "Checkout succeeded."
          ls -la
          node --version || echo "node not installed"
