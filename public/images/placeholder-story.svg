<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Illustration coming soon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)" />

  <g transform="translate(400 300)">
    <circle r="210" fill="#ffffff" opacity="0.55" />
    <circle r="165" fill="#ffffff" opacity="0.75" />

    <g transform="translate(-110 -90)">
      <rect x="0" y="0" width="220" height="170" rx="14" fill="url(#book)" />
      <rect x="14" y="14" width="192" height="142" rx="8" fill="#fefce8" />
      <line x1="110" y1="14" x2="110" y2="156" stroke="#a78bfa" stroke-width="2" />
      <line x1="35"  y1="50"  x2="95"  y2="50"  stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" />
      <line x1="35"  y1="70"  x2="90"  y2="70"  stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" />
      <line x1="35"  y1="90"  x2="100" y2="90"  stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" />
      <line x1="125" y1="50"  x2="185" y2="50"  stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" />
      <line x1="125" y1="70"  x2="180" y2="70"  stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" />
      <line x1="125" y1="90"  x2="190" y2="90"  stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" />
    </g>

    <text x="0" y="130" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5b21b6">
      Your illustration is on its way!
    </text>
    <text x="0" y="162" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#7c3aed">
      (we'll paint this page in a moment)
    </text>
  </g>

  <g opacity="0.9">
    <circle cx="120" cy="110" r="6" fill="#fff" />
    <circle cx="680" cy="90"  r="4" fill="#fff" />
    <circle cx="720" cy="480" r="5" fill="#fff" />
    <circle cx="90"  cy="500" r="4" fill="#fff" />
  </g>
</svg>
