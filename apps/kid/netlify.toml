# Netlify config for the GSI Kid app (kids.gsi.ai).
#
# In the Netlify dashboard, configure the site with:
#   - Repository: yuviguru/GSI-AI-STUDIO
#   - Base directory: apps/kid
#   - Build command: pnpm --filter @gsi/app-kid build
#   - Publish directory: .next (relative to base = apps/kid/.next)
#   - Functions directory: netlify/functions (relative to base = apps/kid/netlify/functions)

[build]
  base = "apps/kid"
  command = "pnpm --filter @gsi/app-kid build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--shamefully-hoist"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Kid-context scheduled functions. Files live in apps/kid/netlify/functions/
# so a school function failure can never block the kid deploy.

[functions."homework-weekly-digest"]
  schedule = "30 13 * * 0"

[functions."leaderboard-refresh"]
  schedule = "5 * * * *"
